[project]
name = "frfix"
version = "0.1.0"
description = "System-wide real-time French autocorrect daemon"
requires-python = ">=3.12"
dependencies = [
    "evdev>=1.7",
    "xkbcommon>=1.0",
    "pygrammalecte>=1.3",
]

[tool.setuptools.packages.find]
include = ["frfix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[project.scripts]
frfix = "frfix.daemon:main"
frfix-bootstrap = "frfix.bootstrap:main"
