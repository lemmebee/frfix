[project]
name = "frfix"
version = "0.1.0"
description = "System-wide real-time French autocorrect daemon"
requires-python = ">=3.12"
dependencies = [
    "evdev>=1.7",
    "python-xlib>=0.33",
    "pygrammalecte>=1.3",
    "PyGObject>=3.42",
]

[tool.setuptools.packages.find]
include = ["frfix*"]

[project.scripts]
frfix = "frfix.daemon:main"
