[project]
name = "frfix"
version = "0.1.0"
description = "System-wide real-time French autocorrect daemon"
requires-python = ">=3.12"
dependencies = [
    "evdev>=1.7",
    "xkbcommon>=1.0",
    "pygrammalecte>=1.3",
]

# The GTK correction overlay is not wired into the daemon yet, and PyGObject
# needs a compiler and gobject-introspection headers, so it stays opt-in.
[project.optional-dependencies]
overlay = ["PyGObject>=3.42"]

[tool.setuptools.packages.find]
include = ["frfix*"]

[project.scripts]
frfix = "frfix.daemon:main"
frfix-bootstrap = "frfix.bootstrap:main"
